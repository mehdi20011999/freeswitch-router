name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev libjson-c-dev libmicrohttpd-dev uuid-dev libreadline-dev pkg-config
          make -j"$(nproc)" WERROR=1
          make test
      - name: Package
        run: |
          name=freeswitch-router-${GITHUB_REF_NAME}-linux-x86_64
          make install DESTDIR="$PWD/dist/$name" PREFIX=/usr/local
          cp README.md scripts/freeswitch-router.service "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" freeswitch-router-*.tar.gz* --generate-notes
